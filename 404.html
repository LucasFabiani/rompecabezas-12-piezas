<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Rompecabezas</title>

  <script>
    const l = window.location;

    /*
      GitHub Pages Project Site:
      https://usuario.github.io/repositorio/ruta

      Tenemos que conservar:
      /repositorio/

      y convertir:
      /4

      en:
      /?p=/4
    */

    const repo = "/rompecabezas-12-piezas";

    const path = l.pathname
      .replace(repo, "")
      .replace(/^\/+/, "");

    l.replace(
      l.protocol + "//" +
      l.hostname +
      repo +
      "/?p=/" +
      path +
      (l.search ? "&q=" + l.search.substring(1) : "") +
      l.hash
    );
  </script>
</head>

<body>
</body>
</html>
